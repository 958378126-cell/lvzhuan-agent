<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- 圆角方块背景（藏青） -->
  <rect x="20" y="20" width="360" height="360" rx="90" fill="#1a2744"/>
  <!-- 外圈（蓝） -->
  <circle cx="200" cy="200" r="110" fill="none" stroke="#2563eb" stroke-width="14"/>
  <!-- 内圈细环 -->
  <circle cx="200" cy="200" r="76" fill="none" stroke="#3b82f6" stroke-width="6" opacity="0.7"/>
  <!-- 中心点 -->
  <circle cx="200" cy="200" r="42" fill="#3b82f6"/>
  <!-- 中心高光 -->
  <circle cx="188" cy="188" r="16" fill="#60a5fa" opacity="0.9"/>
</svg>
